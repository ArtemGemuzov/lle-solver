name: a.gemuzov
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Прямые зависимости из uv.lock для Linux, Python 3.12 и pinn-cuda.
  - python=3.12
  - matplotlib-base=3.11.2
  - numpy=2.5.4
  - pydantic=2.14.2
  - pyyaml=6.0.3
  - scipy=1.18.1
  - deepxde=1.15.1
  - pytorch-gpu=2.11.0
  - cuda-version=12.8
variables:
  DDE_BACKEND: pytorch
