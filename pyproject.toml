[project]
name = "lle-solver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
]
pinn = [
    "deepxde==1.15.1",
    "torch>=2.5",
]
pinn-cuda = [
    "deepxde==1.15.1",
    "torch>=2.5",
]

[tool.ruff]
target-version = "py311"
include = ["src/**/*.py", "scripts/**/*.py"]
force-exclude = true
extend-exclude = ["*.ipynb", "experiments", "analysis", "draft"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "PLE", "RUF100"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "lle"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Physics is shared by computation, field tools and workflows"
type = "protected"
protected_modules = ["lle.physics"]
allowed_importers = [
    "lle.analysis",
    "lle.numerics",
    "lle.pinn",
    "lle.storage",
    "lle.viz",
    "lle.workflows",
]

[[tool.importlinter.contracts]]
name = "Only run infrastructure and workflows import configuration"
type = "protected"
protected_modules = ["lle.config"]
allowed_importers = ["lle.runs", "lle.workflows"]

[[tool.importlinter.contracts]]
name = "Only workflows import computation and storage packages"
type = "protected"
protected_modules = ["lle.numerics", "lle.pinn", "lle.runs", "lle.storage"]
allowed_importers = ["lle.workflows"]

[[tool.importlinter.contracts]]
name = "Analysis, visualization and workflows are entry points"
type = "protected"
protected_modules = ["lle.analysis", "lle.viz", "lle.workflows"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "SSFM and PINN workflows are independent"
type = "independence"
modules = ["lle.workflows.ssfm_gaussian", "lle.workflows.pinn_gaussian"]

[[tool.importlinter.contracts]]
name = "Physics, numerics and SSFM are independent of PINN libraries"
type = "forbidden"
source_modules = ["lle.physics", "lle.numerics", "lle.workflows.ssfm_gaussian"]
forbidden_modules = ["deepxde", "torch"]

[tool.uv]
conflicts = [
    [{ extra = "pinn" }, { extra = "pinn-cuda" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "pinn-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]
