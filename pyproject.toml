[project]
name = "lle-solver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
