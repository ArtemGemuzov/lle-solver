<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>LLE</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-2: #171c27;
    --line: #232938;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --accent-forward: #4f9dde;
    --accent-hold: #8a93a6;
    --accent-backward: #e0654f;
    --accent-confirm: #b57edc;
    --accent-settle: #52c785;
    --field-fill: #e0654f;
    --spec-line: #52c785;
    --grid: #1c2230;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 18px 0;
  }
  .readout {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .readout-cell {
    background: var(--panel);
    padding: 10px 14px;
  }
  .readout-label {
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }
  .readout-value {
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 19px;
    font-variant-numeric: tabular-nums;
  }
  .phase-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .plots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px 10px 16px;
  }
  .panel-title {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  canvas { display: block; width: 100%; }
  .timeline-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  #timelineCanvas { cursor: pointer; }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #1d2330; }
  button.primary {
    background: var(--accent-forward);
    border-color: var(--accent-forward);
    color: #06101c;
    font-weight: 600;
    min-width: 74px;
  }
  input[type=range] {
    flex: 1;
    accent-color: var(--accent-forward);
  }
  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 13px;
    font-family: inherit;
  }
  .frame-counter {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    min-width: 90px;
    text-align: right;
  }
  .legend {
    display: flex;
    gap: 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="page-title"></h1>
  <p class="subtitle" id="page-subtitle"></p>

  <div class="readout">
    <div class="readout-cell">
      <div class="readout-label">τ (время)</div>
      <div class="readout-value" id="v-tau">—</div>
    </div>
    <div class="readout-cell">
      <div class="readout-label">Δ (расстройка)</div>
      <div class="readout-value" id="v-zeta">—</div>
    </div>
    <div class="readout-cell">
      <div class="readout-label">⟨|ψ|²⟩ (мощность)</div>
      <div class="readout-value" id="v-power">—</div>
    </div>
    <div class="readout-cell">
      <div class="readout-label">пики поля</div>
      <div class="readout-value" id="v-n">—</div>
    </div>
    <div class="readout-cell">
      <div class="readout-label">фаза</div>
      <div class="readout-value"><span class="phase-badge" id="v-phase">—</span></div>
    </div>
  </div>

  <div class="plots">
    <div class="panel">
      <div class="panel-title"><span>Поле |F(τ)|²</span><span id="field-max"></span></div>
      <canvas id="fieldCanvas" width="1000" height="360"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title"><span>Спектр, дБ</span><span id="spec-info"></span></div>
      <canvas id="specCanvas" width="1000" height="360"></canvas>
    </div>
  </div>

  <div class="timeline-panel">
    <canvas id="timelineCanvas" width="2200" height="140"></canvas>
    <div class="controls">
      <button class="primary" id="playBtn">▶ Play</button>
      <button id="stepBack">◀</button>
      <button id="stepFwd">▶</button>
      <input type="range" id="scrubber" min="0" max="1" value="0" step="1">
      <span class="frame-counter" id="frameCounter">0 / 0</span>
      <select id="speedSelect">
        <option value="4">4×</option>
        <option value="2">2×</option>
        <option value="1" selected>1×</option>
        <option value="0.4">0.4×</option>
        <option value="0.15">0.15×</option>
      </select>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const DATA = __DATA_JSON__;

const frames = DATA.frames;
const meta = DATA.meta;
const thetaDs = meta.theta_ds;
const modesDs = meta.modes_ds;
const nFrames = frames.length;

const phaseColor = {};
const phaseLabelRu = {};
for (const [key, phase] of Object.entries(meta.phases)) {
  phaseColor[key] = phase.color;
  phaseLabelRu[key] = phase.label;
}

function getCss(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

let curIdx = 0;
let playing = false;
let playSpeed = 1;
let lastFrameTime = 0;
const BASE_FPS = 30;

const fieldCanvas = document.getElementById('fieldCanvas');
const specCanvas = document.getElementById('specCanvas');
const timelineCanvas = document.getElementById('timelineCanvas');
const fctx = fieldCanvas.getContext('2d');
const sctx = specCanvas.getContext('2d');
const tctx = timelineCanvas.getContext('2d');

const fieldMaxGlobal = Math.max(...frames.map(f => Math.max(...f.field))) * 1.08;
const powerMaxGlobal = Math.max(...frames.map(f => f.P));
const tauMax = frames[nFrames-1].tau;
const tauMin = frames[0].tau;

function drawField(frame) {
  const w = fieldCanvas.width, h = fieldCanvas.height;
  fctx.clearRect(0,0,w,h);
  const padL=46, padR=14, padT=10, padB=28;
  const plotW = w-padL-padR, plotH = h-padT-padB;

  // grid
  fctx.strokeStyle = getCss('--grid');
  fctx.lineWidth = 1;
  fctx.font = '11px monospace';
  fctx.fillStyle = getCss('--text-dim');
  for (let i=0;i<=4;i++){
    const yy = padT + plotH*i/4;
    fctx.beginPath(); fctx.moveTo(padL,yy); fctx.lineTo(w-padR,yy); fctx.stroke();
    const val = fieldMaxGlobal*(1-i/4);
    fctx.fillText(val.toFixed(1), 4, yy+4);
  }
  fctx.strokeStyle = getCss('--line');
  fctx.beginPath(); fctx.moveTo(padL,padT); fctx.lineTo(padL,h-padB); fctx.lineTo(w-padR,h-padB); fctx.stroke();

  const n = thetaDs.length;
  const x = i => padL + plotW*i/(n-1);
  const y = v => padT + plotH*(1 - v/fieldMaxGlobal);

  fctx.beginPath();
  fctx.moveTo(x(0), y(frame.field[0]));
  for (let i=1;i<n;i++) fctx.lineTo(x(i), y(frame.field[i]));
  fctx.lineTo(x(n-1), y(0)); fctx.lineTo(x(0), y(0)); fctx.closePath();
  fctx.fillStyle = getCss('--field-fill') + '33';
  fctx.fill();

  fctx.beginPath();
  fctx.moveTo(x(0), y(frame.field[0]));
  for (let i=1;i<n;i++) fctx.lineTo(x(i), y(frame.field[i]));
  fctx.strokeStyle = getCss('--field-fill');
  fctx.lineWidth = 2;
  fctx.stroke();

  fctx.fillStyle = getCss('--text-dim');
  fctx.font = '11px monospace';
  fctx.fillText(thetaDs[0].toFixed(0), padL-2, h-10);
  fctx.fillText('0', padL+plotW/2-4, h-10);
  fctx.fillText(thetaDs[thetaDs.length-1].toFixed(0), w-padR-18, h-10);

  document.getElementById('field-max').textContent = 'max ' + Math.max(...frame.field).toFixed(2);
}

function drawSpectrum(frame) {
  const w = specCanvas.width, h = specCanvas.height;
  sctx.clearRect(0,0,w,h);
  const padL=46, padR=14, padT=10, padB=28;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const yMin=-80, yMax=5;

  sctx.strokeStyle = getCss('--grid');
  sctx.font = '11px monospace';
  sctx.fillStyle = getCss('--text-dim');
  for (let i=0;i<=4;i++){
    const yy = padT + plotH*i/4;
    sctx.beginPath(); sctx.moveTo(padL,yy); sctx.lineTo(w-padR,yy); sctx.stroke();
    const val = yMax + (yMin-yMax)*i/4;
    sctx.fillText(val.toFixed(0), 6, yy+4);
  }
  sctx.strokeStyle = getCss('--line');
  sctx.beginPath(); sctx.moveTo(padL,padT); sctx.lineTo(padL,h-padB); sctx.lineTo(w-padR,h-padB); sctx.stroke();

  const n = modesDs.length;
  const x = i => padL + plotW*i/(n-1);
  const y = v => padT + plotH*(yMax-v)/(yMax-yMin);

  sctx.beginPath();
  let started = false;
  for (let i=0;i<n;i++){
    const v = Math.max(frame.spec[i], yMin);
    if (!started){ sctx.moveTo(x(i), y(v)); started = true; }
    else sctx.lineTo(x(i), y(v));
  }
  sctx.strokeStyle = getCss('--spec-line');
  sctx.lineWidth = 1.4;
  sctx.stroke();

  sctx.fillStyle = getCss('--text-dim');
  sctx.font = '11px monospace';
  sctx.fillText(modesDs[0].toFixed(0), padL-4, h-10);
  sctx.fillText('0', padL+plotW/2-4, h-10);
  sctx.fillText('+' + modesDs[modesDs.length-1].toFixed(0), w-padR-26, h-10);

  document.getElementById('spec-info').textContent = '\u03bc \u2208 [' + modesDs[0].toFixed(0) + ', +' + modesDs[modesDs.length-1].toFixed(0) + ']';
}

function drawTimeline() {
  const w = timelineCanvas.width, h = timelineCanvas.height;
  tctx.clearRect(0,0,w,h);
  const padL=6, padR=6, padT=8, padB=20;
  const plotW = w-padL-padR, plotH = h-padT-padB;

  // phase background bands
  for (let i=0;i<nFrames;i++){
    const f = frames[i];
    const xL = padL + plotW*i/nFrames;
    const xR = padL + plotW*(i+1)/nFrames;
    tctx.fillStyle = phaseColor[f.phase] + '30';
    tctx.fillRect(xL, padT, xR-xL+1, plotH);
  }

  // power trace
  tctx.beginPath();
  for (let i=0;i<nFrames;i++){
    const f = frames[i];
    const xx = padL + plotW*i/nFrames;
    const yy = padT + plotH*(1 - f.P/powerMaxGlobal);
    if (i===0) tctx.moveTo(xx,yy); else tctx.lineTo(xx,yy);
  }
  tctx.strokeStyle = '#ffffff';
  tctx.globalAlpha = 0.75;
  tctx.lineWidth = 1.6;
  tctx.stroke();
  tctx.globalAlpha = 1;

  timelineStatic = tctx.getImageData(0,0,w,h);
}
let timelineStatic = null;

function drawPlayhead() {
  const w = timelineCanvas.width, h = timelineCanvas.height;
  if (timelineStatic) tctx.putImageData(timelineStatic, 0, 0);
  const padL=6, padR=6, padT=8, padB=20;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const xx = padL + plotW*curIdx/nFrames;
  tctx.strokeStyle = '#f5c542';
  tctx.lineWidth = 2;
  tctx.beginPath(); tctx.moveTo(xx, padT); tctx.lineTo(xx, padT+plotH); tctx.stroke();
}

function updateReadout(frame) {
  document.getElementById('v-tau').textContent = frame.tau.toFixed(3);
  document.getElementById('v-zeta').textContent = frame.zeta0.toFixed(3);
  document.getElementById('v-power').textContent = frame.P.toFixed(4);
  document.getElementById('v-n').textContent = frame.phase==='forward' && frame.N>20 ? '~MI' : frame.N;
  const badge = document.getElementById('v-phase');
  badge.textContent = phaseLabelRu[frame.phase];
  badge.style.background = phaseColor[frame.phase] + '2a';
  badge.style.color = phaseColor[frame.phase];
  document.getElementById('scrubber').value = curIdx;
  document.getElementById('frameCounter').textContent = (curIdx+1) + ' / ' + nFrames;
}

function render() {
  const frame = frames[curIdx];
  drawField(frame);
  drawSpectrum(frame);
  drawPlayhead();
  updateReadout(frame);
}

function setIdx(i) {
  curIdx = Math.max(0, Math.min(nFrames-1, i));
  render();
}

document.getElementById('scrubber').max = nFrames-1;
document.getElementById('scrubber').addEventListener('input', e => { pause(); setIdx(parseInt(e.target.value)); });
document.getElementById('stepBack').addEventListener('click', () => { pause(); setIdx(curIdx-1); });
document.getElementById('stepFwd').addEventListener('click', () => { pause(); setIdx(curIdx+1); });
document.getElementById('speedSelect').addEventListener('change', e => { playSpeed = parseFloat(e.target.value); });

timelineCanvas.addEventListener('click', e => {
  pause();
  const rect = timelineCanvas.getBoundingClientRect();
  const xFrac = (e.clientX - rect.left)/rect.width;
  setIdx(Math.round(xFrac*nFrames));
});

const playBtn = document.getElementById('playBtn');
function play(){ playing = true; playBtn.textContent = '⏸ Pause'; lastFrameTime = performance.now(); requestAnimationFrame(loop); }
function pause(){ playing = false; playBtn.textContent = '▶ Play'; }
playBtn.addEventListener('click', () => { playing ? pause() : play(); });

function loop(now){
  if (!playing) return;
  const dt = now - lastFrameTime;
  const frameInterval = 1000/(BASE_FPS*playSpeed);
  if (dt >= frameInterval) {
    lastFrameTime = now;
    if (curIdx >= nFrames-1) { pause(); }
    else { setIdx(curIdx+1); }
  }
  if (playing) requestAnimationFrame(loop);
}

document.title = meta.title;
document.getElementById('page-title').textContent = meta.title;
document.getElementById('page-subtitle').textContent = meta.subtitle;

const legend = document.getElementById('legend');
for (const phase of Object.values(meta.phases)) {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const swatch = document.createElement('span');
  swatch.className = 'swatch';
  swatch.style.background = phase.color;
  item.append(swatch, phase.label);
  legend.append(item);
}

drawTimeline();
setIdx(0);
</script>
</body>
</html>
